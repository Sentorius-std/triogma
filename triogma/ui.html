<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>board editor</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e9ef; --muted:#8b94a7; --accent:#6366f1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  #app{display:grid;grid-template-columns:1fr 288px;height:100%}
  #stage{position:relative;overflow:hidden;background:#f8f9fb}
  /* Promote to a GPU layer ONLY while interacting. Persistent will-change on a
     huge element makes Chrome eagerly rasterize the whole board, so every zoom
     step re-rasters a giant texture (the lag). Transient promotion lets it tile
     and rasterize lazily — only the visible region, at the current scale. */
  #canvas{position:absolute;top:0;left:0;transform-origin:0 0}
  #canvas.live{will-change:transform}
  svg{display:block}
  #stage.panning{cursor:grabbing}

  /* ---- top toolbar ---- */
  #bar{position:absolute;top:14px;left:14px;z-index:10;display:flex;gap:6px;
    background:rgba(23,26,33,.94);border:1px solid var(--line);border-radius:12px;
    padding:7px;backdrop-filter:blur(8px);box-shadow:0 8px 26px rgba(0,0,0,.35)}
  #bar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500}
  #bar button:hover{background:#252a35;border-color:#39404e}
  #bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #bar select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;max-width:240px;cursor:pointer}
  #bar select:hover{border-color:#39404e}
  #bar .sep{width:1px;background:var(--line);margin:2px 4px}
  #bar #status{font-size:12px;color:var(--muted);align-self:center;padding:0 8px}

  /* ---- inspector ---- */
  #side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
    display:flex;flex-direction:column;gap:14px;padding:16px}
  #side h2{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:11px;color:var(--muted);font-weight:500}
  textarea,input,select{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;
    resize:vertical}
  textarea{min-height:96px;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sw{height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .sw:hover{transform:translateY(-1px)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .empty{color:var(--muted);font-size:12px;line-height:1.6}
  .hint{font-size:11px;color:var(--muted);line-height:1.6;
    border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-size:10px}
  #del{background:#3a1d1d;border-color:#5b2a2a;color:#ffb4b4}
  #del:hover{background:#4a2222}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bar">
      <select id="boardPicker" title="Choose a board"></select>
      <div class="sep"></div>
      <button id="bBox">+ Box</button>
      <button id="bNote">+ Note</button>
      <div class="sep"></div>
      <button id="bLink">Connect</button>
      <div class="sep"></div>
      <button id="bSave">Save</button>
      <button id="bRender">Render PNG</button>
      <button id="bExport">Export</button>
      <div class="sep"></div>
      <button id="bFit">Fit</button>
      <button id="bReset">100%</button>
      <span id="status">loading…</span>
    </div>
    <div id="canvas"><svg id="svg"><defs>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M24 0H0V24" fill="none" stroke="#e7eaef" stroke-width="1"/>
      </pattern>
    </defs><rect id="bg" width="100%" height="100%" fill="url(#grid)"/></svg></div>
  </div>

  <div id="side">
    <h2>Inspector</h2>
    <div id="insp"><div class="empty">Nothing selected.<br>Click a card to edit it.</div></div>
    <div class="hint">
      <b>Drag empty space</b> to pan · <b>scroll</b> to zoom.<br>
      <b>Drag</b> a card to move it.<br>
      <b>Double-click</b> to edit text.<br>
      <b>Connect</b> then click two cards to link them.<br>
      <kbd>Del</kbd> removes the selection.<br>
      <kbd>Ctrl</kbd>+<kbd>S</kbd> saves · <b>Fit</b> frames the board.
    </div>
  </div>
</div>

<script>
const ACCENTS = {root:"#4f46e5", box:"#2563eb", note:"#d97706", good:"#16a34a", bad:"#dc2626"};
const PALETTE = ["#2563eb","#4f46e5","#d97706","#16a34a","#dc2626"];

let board = {title:"Untitled board", nodes:[], edges:[]};
let sel = null, linkFrom = null, dirty = false;
let drag = null;

const $ = (s) => document.querySelector(s);
const svg = $("#svg"), stage = $("#stage"), status = $("#status"), canvas = $("#canvas");

function setStatus(t){ status.textContent = t; }

/* ---------------- geometry ---------------- */
const NW = 210, NH = 54, PAD = 18, LINE = 18;
// Word-wrap a label to a character budget, honouring explicit newlines.
function wrapToChars(label, cols){
  const lines = [];
  String(label).split("\n").forEach(p=>{
    let cur = "";
    p.split(" ").forEach(w=>{
      if ((cur+" "+w).trim().length <= cols || !cur) cur = (cur+" "+w).trim();
      else { lines.push(cur); cur = w; }
    });
    lines.push(cur);
  });
  return lines.length ? lines : [""];
}
function noteSize(n){
  const lines = wrapToChars(n.label, 44);
  return {w:340, h:Math.max(46, lines.length*LINE + 26), lines};
}
function sizeOf(n){
  if (n.kind === "note") return noteSize(n);
  // Keep the box at its laid-out width (columns stay aligned) but wrap the text
  // to that width and grow the height so nothing spills past the rectangle.
  const w = n.w || NW;
  const cols = Math.max(6, Math.floor((w - 44) / 7.6));
  const lines = wrapToChars(n.label, cols);
  const h = Math.max(n.h || NH, lines.length*LINE + 24);
  return {w, h, lines};
}
function nodeById(id){ return board.nodes.find(n=>n.id===id); }

/* ---------------- view (pan / zoom via GPU CSS transform) ----------------
   We move/scale the #canvas layer with a CSS transform instead of repainting the
   SVG (viewBox). The board rasterizes once; panning is a single style write the
   compositor handles on the GPU — no vector repaint per frame. x,y are screen px. */
let view = {x:0, y:0, scale:1};
function applyView(){
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}
function contentBounds(){
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  board.nodes.forEach(n=>{ const s=sizeOfCached(n);
    minx=Math.min(minx,n.x); miny=Math.min(miny,n.y);
    maxx=Math.max(maxx,n.x+s.w); maxy=Math.max(maxy,n.y+s.h); });
  if(!isFinite(minx)) return {minx:0,miny:0,maxx:900,maxy:600};
  return {minx,miny,maxx,maxy};
}
function frame(scale){             // place content top-left at a margin, at `scale`
  const b = contentBounds(), pad = 40;
  view.scale = scale;
  view.x = pad - b.minx*scale;
  view.y = pad - b.miny*scale;
  applyView();
}
function fitView(){
  const b = contentBounds(), pad = 40;
  const w = stage.clientWidth, h = stage.clientHeight;
  const s = Math.max(0.1, Math.min((w-2*pad)/((b.maxx-b.minx)||1),
                                   (h-2*pad)/((b.maxy-b.miny)||1), 1));
  frame(s);
}
function initialView(){            // frame the full WIDTH, top-aligned; pan down to read
  const b = contentBounds(), pad = 40;
  const w = stage.clientWidth;
  frame(Math.max(0.2, Math.min(1, (w-2*pad)/((b.maxx-b.minx)||1))));
}
function resetView(){ frame(1); }

/* ---------------- render ----------------
   Each node is a <g transform="translate(x,y)"> with LOCAL coords, so moving it
   is one transform write (no DOM rebuild). Edges are indexed by node id so a drag
   only re-paths the few connected edges. No SVG drop-shadow filters (they re-
   rasterize every frame) — a flat offset rect fakes the shadow for ~free. */
const NS = "http://www.w3.org/2000/svg";
let nodeEls = {}, nodeRectEls = {}, edgeIndex = {};
const sizeCache = new Map();
function sizeOfCached(n){
  const key = n.id+"|"+n.kind+"|"+(n.w||"")+"|"+(n.h||"")+"|"+n.label;
  let s = sizeCache.get(key);
  if(!s){ s = sizeOf(n); sizeCache.set(key, s); }
  return s;
}
function edgeD(a,b){
  const sa = sizeOfCached(a), sb = sizeOfCached(b);
  const x1 = a.x+sa.w, y1 = a.y+sa.h/2, x2 = b.x, y2 = b.y+sb.h/2;
  const mx = x1 + (x2-x1)*0.45, r = 14, s = y2>y1?1:-1;
  return Math.abs(y2-y1)<2
    ? `M${x1} ${y1} L${x2} ${y2}`
    : `M${x1} ${y1} L${mx-r} ${y1} Q${mx} ${y1} ${mx} ${y1+s*r} L${mx} ${y2-s*r} Q${mx} ${y2} ${mx+r} ${y2} L${x2} ${y2}`;
}
function render(){
  [...svg.querySelectorAll("g.node,g.edge,path.edge")].forEach(e=>e.remove());
  nodeEls = {}; nodeRectEls = {}; edgeIndex = {}; sizeCache.clear();

  // edges (under nodes), indexed by each endpoint for cheap drag updates
  board.edges.forEach(e=>{
    const a = nodeById(e.from), b = nodeById(e.to);
    if(!a||!b) return;
    const p = document.createElementNS(NS,"path");
    p.setAttribute("d", edgeD(a,b)); p.setAttribute("fill","none");
    p.setAttribute("stroke","#94a3b8"); p.setAttribute("stroke-width","2");
    p.setAttribute("class","edge");
    svg.appendChild(p);
    const rec = {el:p, from:e.from, to:e.to};
    (edgeIndex[e.from] ||= []).push(rec);
    (edgeIndex[e.to]   ||= []).push(rec);
  });

  // nodes — positioned by group transform, drawn in local coords
  board.nodes.forEach(n=>{
    const s = sizeOfCached(n);
    const g = document.createElementNS(NS,"g");
    g.setAttribute("class","node"); g.dataset.id = n.id;
    g.setAttribute("transform",`translate(${n.x},${n.y})`);
    g.style.cursor = "grab";

    if (n.kind !== "note"){            // flat shadow, no filter
      const sh = document.createElementNS(NS,"rect");
      sh.setAttribute("x",0); sh.setAttribute("y",2);
      sh.setAttribute("width",s.w); sh.setAttribute("height",s.h);
      sh.setAttribute("rx","10"); sh.setAttribute("fill","rgba(15,23,42,.07)");
      g.appendChild(sh);
    }
    const rect = document.createElementNS(NS,"rect");
    rect.setAttribute("x",0); rect.setAttribute("y",0);
    rect.setAttribute("width",s.w); rect.setAttribute("height",s.h);
    rect.setAttribute("rx","10"); rect.setAttribute("fill","#ffffff");
    rect.setAttribute("stroke", sel===n.id ? "#6366f1" : "#cbd5e1");
    rect.setAttribute("stroke-width", sel===n.id ? "2.5" : "1.6");
    g.appendChild(rect);
    nodeRectEls[n.id] = rect;

    const rail = document.createElementNS(NS,"rect");
    rail.setAttribute("x",1); rail.setAttribute("y",1);
    rail.setAttribute("width","5"); rail.setAttribute("height",s.h-2);
    rail.setAttribute("rx","2.5");
    rail.setAttribute("fill", n.color || ACCENTS[n.kind] || ACCENTS.box);
    g.appendChild(rail);

    const total = s.lines.length*LINE;
    let cy = (s.h - total)/2;
    s.lines.forEach((ln,i)=>{
      const t = document.createElementNS(NS,"text");
      t.setAttribute("x", PAD + 12);
      t.setAttribute("y", cy + i*LINE + 13);
      t.setAttribute("font-size", n.kind==="note" ? "13" : "14");
      t.setAttribute("fill", n.kind==="note" ? "#64748b" : "#17202e");
      t.setAttribute("font-family","Inter,-apple-system,Segoe UI,sans-serif");
      if (n.kind!=="note") t.setAttribute("font-weight","500");
      t.textContent = ln;
      g.appendChild(t);
    });

    g.addEventListener("mousedown", ev=>onDown(ev,n));
    g.addEventListener("dblclick", ev=>{ ev.stopPropagation(); editText(n); });
    nodeEls[n.id] = g;
    svg.appendChild(g);
  });

  // size the canvas layer (and its grid) to the content
  const b = contentBounds();
  const W = Math.max(900, b.maxx + 80), H = Math.max(600, b.maxy + 80);
  svg.setAttribute("width", W);  svg.setAttribute("height", H);
  const bg = $("#bg");
  bg.setAttribute("x", 0); bg.setAttribute("y", 0);
  bg.setAttribute("width", W); bg.setAttribute("height", H);
}
// cheap incremental updates (no DOM rebuild)
function moveNode(n){
  const g = nodeEls[n.id];
  if(g) g.setAttribute("transform",`translate(${n.x},${n.y})`);
  (edgeIndex[n.id]||[]).forEach(rec=>{
    const a = nodeById(rec.from), b = nodeById(rec.to);
    if(a&&b) rec.el.setAttribute("d", edgeD(a,b));
  });
}
function setSelected(id){
  const prev = sel; sel = id;
  [prev, id].forEach(k=>{
    const r = nodeRectEls[k]; if(!r) return;
    r.setAttribute("stroke", sel===k ? "#6366f1" : "#cbd5e1");
    r.setAttribute("stroke-width", sel===k ? "2.5" : "1.6");
  });
}

/* ---------------- interaction ---------------- */
function onDown(ev,n){
  ev.stopPropagation();
  if (linkFrom){
    if (linkFrom !== n.id) addEdge(linkFrom, n.id);
    linkFrom = null; $("#bLink").classList.remove("on"); setStatus("saved? press Save");
    render(); return;
  }
  setSelected(n.id); inspect();
  const pt = ptInSvg(ev);
  drag = {id:n.id, dx: pt.x - n.x, dy: pt.y - n.y, moved:false};
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}
let dragRaf = false, dragPt = null;
function onMove(ev){
  if(!drag) return;
  dragPt = ptInSvg(ev);
  if(dragRaf) return;                 // coalesce to one update per frame
  dragRaf = true;
  requestAnimationFrame(()=>{
    dragRaf = false;
    if(!drag || !dragPt) return;
    const n = nodeById(drag.id); if(!n) return;
    n.x = Math.round(dragPt.x - drag.dx); n.y = Math.round(dragPt.y - drag.dy);
    drag.moved = true;
    moveNode(n);                       // transform + connected edges only
  });
}
function onUp(){
  if (drag && drag.moved) markDirty();
  drag = null; dragPt = null;
  document.removeEventListener("mousemove", onMove);
  document.removeEventListener("mouseup", onUp);
}
function ptInSvg(ev){
  // Screen pixels -> board coordinates (inverse of the canvas CSS transform).
  const r = stage.getBoundingClientRect();
  return {x:(ev.clientX - r.left - view.x)/view.scale,
          y:(ev.clientY - r.top  - view.y)/view.scale};
}

/* ---- pan anywhere on the stage, wheel to zoom (Figma-style) ---- */
let viewRaf = false, liveTimer = null;
function markLive(){                      // GPU-promote the layer during interaction only
  canvas.classList.add("live");
  clearTimeout(liveTimer);
  liveTimer = setTimeout(()=>canvas.classList.remove("live"), 260);
}
function scheduleView(){                  // coalesce high-frequency pan/zoom to one frame
  markLive();
  if(viewRaf) return;
  viewRaf = true;
  requestAnimationFrame(()=>{ viewRaf = false; applyView(); });
}
let pan = null;
stage.addEventListener("mousedown", ev=>{
  if(ev.target.closest("#bar")) return;          // don't pan when clicking the toolbar
  linkFrom = null; $("#bLink").classList.remove("on");
  setSelected(null); inspect();
  pan = {cx:ev.clientX, cy:ev.clientY, vx:view.x, vy:view.y};
  stage.classList.add("panning");
  document.addEventListener("mousemove", onPan);
  document.addEventListener("mouseup", endPan);
});
function onPan(ev){
  if(!pan) return;
  view.x = pan.vx + (ev.clientX - pan.cx);   // screen-px translate, applied directly
  view.y = pan.vy + (ev.clientY - pan.cy);
  scheduleView();
}
function endPan(){
  pan = null; stage.classList.remove("panning");
  document.removeEventListener("mousemove", onPan);
  document.removeEventListener("mouseup", endPan);
}
stage.addEventListener("wheel", ev=>{
  if(ev.target.closest("#bar")) return;
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;         // cursor in stage px
  const factor = ev.deltaY < 0 ? 1.1 : 1/1.1;
  const s2 = Math.min(3, Math.max(0.1, view.scale*factor));
  view.x = mx - (mx - view.x)/view.scale * s2;                     // keep board point under cursor
  view.y = my - (my - view.y)/view.scale * s2;
  view.scale = s2;
  scheduleView();
}, {passive:false});
window.addEventListener("resize", scheduleView);

/* ---------------- inspector ---------------- */
function inspect(){
  const box = $("#insp");
  const n = sel ? nodeById(sel) : null;
  if(!n){ box.innerHTML = '<div class="empty">Nothing selected.<br>Click a card to edit it.</div>'; return; }
  box.innerHTML = `
    <div class="row"><label>Text</label>
      <textarea id="fLabel"></textarea></div>
    <div class="row"><label>Type</label>
      <select id="fKind">
        ${["root","box","note","good","bad"].map(k=>
          `<option value="${k}" ${n.kind===k?"selected":""}>${k}</option>`).join("")}
      </select></div>
    <div class="row"><label>Accent colour</label>
      <div class="swatches" id="fSw">
        ${PALETTE.map(c=>`<div class="sw ${((n.color||ACCENTS[n.kind])===c)?"on":""}"
            data-c="${c}" style="background:${c}"></div>`).join("")}
      </div></div>
    <div class="row"><button id="del">Delete node</button></div>`;

  const ta = $("#fLabel");
  ta.value = n.label;
  ta.addEventListener("input", ()=>{ n.label = ta.value; markDirty(); render(); });
  $("#fKind").addEventListener("change", e=>{ n.kind=e.target.value; markDirty(); render(); inspect(); });
  $("#fSw").addEventListener("click", e=>{
    const c = e.target.dataset.c; if(!c) return;
    n.color = c; markDirty(); render(); inspect();
  });
  $("#del").addEventListener("click", ()=>{ removeNode(n.id); });
}

/* ---------------- mutations ---------------- */
function uid(){ return "n" + Math.random().toString(36).slice(2,9); }
function nextPos(){
  if(!board.nodes.length) return {x:120,y:140};
  const last = board.nodes[board.nodes.length-1];
  return {x:last.x, y:last.y + sizeOf(last).h + 28};
}
function addNode(kind, label){
  const p = nextPos();
  const n = {id:uid(), label: label || (kind==="note" ? "New note" : "New box"),
             kind, x:p.x, y:p.y};
  board.nodes.push(n); sel = n.id; markDirty(); render(); inspect();
}
function addEdge(a,b){
  if(a===b) return;
  if(board.edges.some(e=>e.from===a&&e.to===b)) return;
  board.edges.push({from:a,to:b}); markDirty();
}
function removeNode(id){
  board.nodes = board.nodes.filter(n=>n.id!==id);
  board.edges = board.edges.filter(e=>e.from!==id&&e.to!==id);
  sel=null; markDirty(); render(); inspect();
}
function editText(n){
  const v = prompt("Card text (\\n for newline):", n.label);
  if(v===null) return;
  n.label = v.replace(/\\n/g,"\n"); markDirty(); render(); inspect();
}
function markDirty(){ dirty = true; setStatus("unsaved"); }

/* ---------------- io ---------------- */
let currentBoard = null;
const picker = $("#boardPicker");

async function loadBoards(){                 // populate the dropdown + open one
  try{
    const data = await (await fetch("/api/boards", {cache:"no-store"})).json();
    const boards = data.boards || [];
    picker.innerHTML = boards.map(b=>
      `<option value="${b.name}">${b.title||b.name}</option>`).join("");
    const names = boards.map(b=>b.name);
    const fromHash = decodeURIComponent((location.hash||"").replace(/^#/,""));
    const initial = names.includes(fromHash) ? fromHash : (data.default || names[0]);
    if(!initial){ setStatus("no boards found"); return; }
    picker.value = initial;
    await loadBoard(initial);
  }catch(e){ setStatus("could not list boards"); }
}
async function loadBoard(name){
  try{
    setStatus("loading…");
    const r = await fetch("/api/board?name="+encodeURIComponent(name), {cache:"no-store"});
    board = await r.json();
    board.nodes ||= []; board.edges ||= [];
    currentBoard = name; dirty = false; sel = null; linkFrom = null;
    if(location.hash.slice(1) !== name) location.hash = name;
    document.title = (board.title || name) + " — board editor";
    setStatus(board.nodes.length + " nodes");
    render();
    requestAnimationFrame(initialView);   // wait one frame so #stage has a size
    inspect();
  }catch(e){ setStatus("load failed"); }
}
picker.addEventListener("change", e=>loadBoard(e.target.value));
window.addEventListener("hashchange", ()=>{
  const n = decodeURIComponent((location.hash||"").replace(/^#/,""));
  if(n && n !== currentBoard){ picker.value = n; loadBoard(n); }
});

async function save(){
  if(!currentBoard){ setStatus("no board selected"); return; }
  try{
    const r = await fetch("/api/board?name="+encodeURIComponent(currentBoard), {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(board)});
    const j = await r.json();
    setStatus(j.ok ? "saved ✓" : "save failed");
    if(j.ok) dirty = false;
  }catch(e){ setStatus("save failed"); }
}
async function renderPng(){
  setStatus("rendering…");
  await save();
  try{
    const r = await fetch("/api/render", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:currentBoard, board})});
    const j = await r.json();
    setStatus(j.ok ? "PNG rendered ✓" : "render failed");
  }catch(e){ setStatus("render failed"); }
}
function exportJson(){
  const blob = new Blob([JSON.stringify(board,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "board.json"; a.click();
}

/* ---------------- wiring ---------------- */
$("#bBox").onclick  = ()=>addNode("box");
$("#bNote").onclick = ()=>addNode("note");
$("#bLink").onclick = (e)=>{ linkFrom = null;
  e.target.classList.toggle("on");
  setStatus(e.target.classList.contains("on") ? "click two cards to link" : "");
  if(e.target.classList.contains("on")) linkFrom = sel; };
$("#bSave").onclick   = save;
$("#bRender").onclick = renderPng;
$("#bExport").onclick = exportJson;
$("#bFit").onclick    = fitView;
$("#bReset").onclick  = resetView;

document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); save(); }
  if((e.key==="Delete"||e.key==="Backspace") && sel &&
     !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault(); removeNode(sel);
  }
});
window.addEventListener("beforeunload", e=>{
  if(dirty){ e.preventDefault(); e.returnValue=""; }
});

loadBoards();
</script>
</body>
</html>
